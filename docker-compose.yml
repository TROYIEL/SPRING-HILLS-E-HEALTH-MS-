services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uhms
      POSTGRES_USER: uhms
      POSTGRES_PASSWORD: uhms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./Backend:/app
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./Backend/.env.example
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
      - redis
      - postgres

  frontend-admin:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./Frontend-Admin:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    env_file:
      - ./Frontend-Admin/.env.example
    ports:
      - "5174:5174"
    depends_on:
      - backend

  frontend-patient:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./Frontend-Patient:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5175"
    env_file:
      - ./Frontend-Patient/.env.example
    ports:
      - "5175:5175"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend-admin
      - frontend-patient
      - backend

volumes:
  postgres_data:
  mongo_data:
